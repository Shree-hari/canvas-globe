<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #070b18;
      color: #f8fafc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body {
      position: relative;
      display: flex;
      align-items: center;
      padding: 74px 82px;
      background:
        radial-gradient(circle at 81% 48%, rgba(34, 211, 238, .18), transparent 31%),
        radial-gradient(circle at 16% 12%, rgba(139, 92, 246, .24), transparent 40%),
        linear-gradient(145deg, #070b18 0%, #0b1024 58%, #071522 100%);
    }
    .grid {
      position: absolute;
      inset: 0;
      opacity: .13;
      background-image:
        linear-gradient(rgba(148, 163, 184, .25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, .25) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(90deg, black, transparent 72%);
    }
    .copy { position: relative; z-index: 2; width: 650px; }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 46px;
      color: #c4b5fd;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: .01em;
    }
    .mark {
      width: 38px;
      height: 38px;
      border: 2px solid #67e8f9;
      border-radius: 50%;
      box-shadow: 0 0 28px rgba(34, 211, 238, .4);
      position: relative;
    }
    .mark::before, .mark::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(196, 181, 253, .8);
      border-radius: 50%;
    }
    .mark::before { inset: 4px 11px; }
    .mark::after { inset: 11px 4px; }
    h1 {
      margin: 0;
      max-width: 660px;
      font-size: 68px;
      line-height: 1.02;
      letter-spacing: -.045em;
    }
    h1 span {
      background: linear-gradient(92deg, #a78bfa, #22d3ee);
      background-clip: text;
      color: transparent;
    }
    p {
      margin: 27px 0 0;
      max-width: 610px;
      color: #b8c4d8;
      font-size: 25px;
      line-height: 1.45;
    }
    .chips { display: flex; gap: 12px; margin-top: 39px; }
    .chip {
      padding: 9px 15px;
      border: 1px solid rgba(148, 163, 184, .26);
      border-radius: 999px;
      background: rgba(15, 23, 42, .58);
      color: #dbeafe;
      font-size: 16px;
    }
    .globe {
      position: absolute;
      z-index: 1;
      right: 36px;
      top: 79px;
      width: 470px;
      height: 470px;
      border: 2px solid rgba(103, 232, 249, .72);
      border-radius: 50%;
      box-shadow:
        inset -38px -28px 70px rgba(2, 6, 23, .75),
        inset 24px 20px 52px rgba(167, 139, 250, .12),
        0 0 70px rgba(34, 211, 238, .2);
      overflow: hidden;
    }
    .latitude, .longitude {
      position: absolute;
      inset: 50%;
      border: 1px solid rgba(103, 232, 249, .24);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .lat1 { width: 91%; height: 36%; top: 31%; }
    .lat2 { width: 91%; height: 36%; top: 69%; }
    .equator { width: 100%; height: 1px; border-radius: 0; }
    .lon1 { width: 43%; height: 100%; }
    .lon2 { width: 78%; height: 100%; }
    .land {
      position: absolute;
      background: linear-gradient(145deg, rgba(167, 139, 250, .82), rgba(34, 211, 238, .58));
      filter: drop-shadow(0 0 13px rgba(34, 211, 238, .26));
    }
    .a {
      left: 77px; top: 88px; width: 118px; height: 178px;
      border-radius: 59% 41% 54% 38% / 33% 51% 49% 67%;
      transform: rotate(-16deg);
      clip-path: polygon(18% 0, 83% 10%, 100% 38%, 72% 54%, 78% 100%, 42% 87%, 19% 59%, 0 37%);
    }
    .b {
      left: 225px; top: 72px; width: 175px; height: 222px;
      border-radius: 44% 56% 61% 39% / 33% 40% 60% 67%;
      transform: rotate(9deg);
      clip-path: polygon(17% 0, 79% 7%, 100% 28%, 83% 48%, 91% 67%, 55% 75%, 42% 100%, 20% 73%, 0 51%, 14% 29%);
    }
    .c {
      left: 285px; top: 319px; width: 92px; height: 75px;
      border-radius: 55% 45% 58% 42%;
      transform: rotate(-14deg);
    }
    .route {
      position: absolute;
      left: 117px; top: 227px;
      width: 253px; height: 105px;
      border-top: 4px solid #f8fafc;
      border-radius: 50%;
      transform: rotate(-12deg);
      opacity: .9;
    }
    .dot {
      position: absolute;
      width: 13px; height: 13px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #f97316;
      box-shadow: 0 0 0 8px rgba(249, 115, 22, .19), 0 0 24px #f97316;
    }
    .d1 { left: 110px; top: 211px; }
    .d2 { left: 357px; top: 278px; background: #22d3ee; box-shadow: 0 0 0 8px rgba(34, 211, 238, .17), 0 0 24px #22d3ee; }
  </style>
</head>
<body>
  <div class="grid"></div>
  <main class="copy">
    <div class="brand"><span class="mark"></span> canvas-globe</div>
    <h1>A globe you can ship <span>today.</span></h1>
    <p>Interactive Canvas 2D globe and world map. Zero dependencies, no WebGL, no network calls.</p>
    <div class="chips">
      <span class="chip">Vanilla</span>
      <span class="chip">React</span>
      <span class="chip">Web Component</span>
    </div>
  </main>
  <div class="globe">
    <span class="latitude lat1"></span>
    <span class="latitude equator"></span>
    <span class="latitude lat2"></span>
    <span class="longitude lon1"></span>
    <span class="longitude lon2"></span>
    <span class="land a"></span>
    <span class="land b"></span>
    <span class="land c"></span>
    <span class="route"></span>
    <span class="dot d1"></span>
    <span class="dot d2"></span>
  </div>
</body>
</html>
