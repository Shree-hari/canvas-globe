<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CanvasGlobe animated README demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #050816; color: #ecfeff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      #capture { width: 800px; height: 450px; overflow: hidden; display: grid; grid-template-columns: 310px 1fr; align-items: center; padding: 30px 34px; background: radial-gradient(circle at 72% 45%, #112b50 0, #070b18 42%, #03050d 78%); }
      .eyebrow { margin: 0 0 12px; color: #67e8f9; font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; max-width: 10ch; font-size: 40px; line-height: 1.02; letter-spacing: -.035em; }
      .sub { margin: 16px 0 18px; color: #b7c8dd; font-size: 15px; line-height: 1.5; }
      .pills { display: flex; flex-wrap: wrap; gap: 7px; }
      .pill { padding: 5px 9px; border: 1px solid rgba(125,211,252,.26); border-radius: 999px; background: rgba(8,18,40,.65); color: #d8f5ff; font-size: 11px; }
      .stage { position: relative; display: grid; place-items: center; min-width: 0; }
      canvas { display: block; width: 410px; height: 410px; touch-action: none; }
      .preset { position: absolute; right: 12px; bottom: 12px; padding: 7px 12px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: rgba(2,6,23,.72); font-size: 12px; font-weight: 700; text-transform: capitalize; }
    </style>
  </head>
  <body>
    <div id="capture">
      <section>
        <p class="eyebrow">canvas-globe</p>
        <h1>Interactive globes without WebGL</h1>
        <p class="sub">Markers, animated routes, choropleths, themes, flat maps, and exports in one Canvas 2D library.</p>
        <div class="pills"><span class="pill">Zero dependencies</span><span class="pill">React</span><span class="pill">Vanilla JS</span><span class="pill">Web Component</span></div>
      </section>
      <div class="stage"><canvas id="globe" width="820" height="820"></canvas><span class="preset" id="preset">hologram</span></div>
    </div>
    <script type="module">
      import { createGlobe } from "../src/index.js";

      const markers = [
        { name: "Ahmedabad", lat: 23.03, lon: 72.58, count: 12, live: true },
        { name: "London", lat: 51.5, lon: -0.12, count: 8 },
        { name: "New York", lat: 40.71, lon: -74.01, count: 6 },
        { name: "Tokyo", lat: 35.68, lon: 139.69, count: 4 },
        { name: "Sao Paulo", lat: -23.55, lon: -46.63, count: 3 },
      ];
      const globe = createGlobe(document.querySelector("#globe"), {
        licenseKey: "canvas-globe-readme-capture",
        preset: "hologram",
        autoRotate: false,
        markers,
        arcs: markers.slice(1).map((city, index) => ({ from: markers[0], to: city, duration: 2200 + index * 260 })),
        orbits: 2,
      });
      const names = ["hologram", "neon", "blueprint", "aurora", "political", "midnight"];
      window.renderDemoFrame = async (frame) => {
        const preset = names[Math.floor(frame / 8) % names.length];
        globe.setPreset(preset);
        globe.setOptions({ orbits: preset === "blueprint" || preset === "aurora" ? 3 : 1 });
        globe.flyTo(-24 + frame * 7.5, 18 + Math.sin(frame / 6) * 8, { instant: true, zoom: 1.08 });
        document.querySelector("#preset").textContent = preset;
        globe.invalidate();
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      };
      window.demoReady = true;
    </script>
  </body>
</html>
