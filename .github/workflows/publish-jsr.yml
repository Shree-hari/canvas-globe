name: Publish JSR release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json and jsr.json version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - name: Confirm requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./package.json');const j=require('./jsr.json');if(p.version!==process.env.REQUESTED_VERSION||j.version!==p.version){console.error('Requested, npm, and JSR versions must match');process.exit(1)}"
      - name: Publish to JSR with provenance
        run: npx --yes jsr publish
