# If this package lives in a monorepo, move this file to the repository root
# and add `defaults: { run: { working-directory: packages/geo-globe } }`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cla:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify recorded CLA acceptance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node -e 'const body = process.env.PR_BODY || ""; const accepted = /- \[[xX]\] I have read and agree to the \[CanvasGlobe Contributor License/.test(body); if (!accepted) { console.error("Check the CanvasGlobe CLA acceptance box in the pull request template."); process.exit(1); }'

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run typecheck

  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:check
