name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to publish (for example 0.1.0)
        required: true
        type: string
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - beta

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - name: Confirm requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node -e "const p=require('./package.json'); if(p.version !== process.env.REQUESTED_VERSION) { console.error('Requested version does not match package.json'); process.exit(1) }"
      - name: Publish with provenance
        run: npm publish --access public --provenance --tag "${{ inputs.npm_tag }}"
