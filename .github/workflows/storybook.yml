name: Storybook

on:
  push:
    branches:
      - main
    paths:
      - ".storybook/**"
      - "stories/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storybook.yml"
  pull_request:
    paths:
      - ".storybook/**"
      - "stories/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build-storybook

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: chromaui/action@c37d9c8c94394613b75837a4ff47c31a94a71d7f # v18.8.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: main
