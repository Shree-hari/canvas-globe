name: Feature request
description: Propose a focused capability or improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need before describing an API.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a user be able to accomplish?
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Suggested API or example
      description: Optional. Include a small usage example if you have one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention workarounds or other libraries you evaluated.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the API documentation.
          required: true
        - label: I can help test this with a realistic example.
          required: false
